# ============================================================
# Caido_xhs 一键部署编排
# 包含两个容器:
#   Caido_xhs      - Caido 抓包代理 (官方镜像)
#   caido_listener - 流量监听器 (提取数据写入 MongoDB)
#
# 用法:
#   ./install.sh                 # 一键安装（推荐）
#   或
#   docker compose up -d --build # 手动启动
#
# ⚠️ 说明：
#   Caido 有 Host 白名单机制（防 DNS rebinding），只接受 IP 形式
#   的 Host 头（服务名/容器名会被 403 拒绝）。
#   监听脚本已内置"主机名自动解析为 IP"逻辑（v8.1+），
#   config.yaml 中 caido.url 写 http://caido:8080 即可，
#   脚本会自动解析成实际 IP 访问，无需任何手动配置。
# ============================================================

services:
  caido:
    image: caido/caido:latest          # 官方镜像，升级: docker compose pull
    container_name: Caido_xhs
    ports:
      - "18000:8080"                   # Web 界面 + HTTP(S) 代理端口
    volumes:
      - caido-data:/data               # Caido 数据持久化（含 CA 证书、项目、认领状态）
    restart: unless-stopped

  listener:
    build: .                           # 使用本目录 Dockerfile 构建
    container_name: caido_listener
    depends_on:
      - caido
    volumes:
      - ./config.yaml:/app/config.yaml:ro   # 真实配置（挂载覆盖镜像内默认）
      - ./data:/app/data                    # tokens.json / last_id.json 持久化
    restart: unless-stopped

volumes:
  caido-data:

# 项目版本 v1.3.0
